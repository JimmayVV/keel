name: Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

# Least privilege per job: the review only reads and comments; only the
# arming job may write to contents (to enable auto-merge).
permissions: {}

jobs:
  review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    uses: JimmayVV/fleet-ci/.github/workflows/claude-review.yml@v1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  arm:
    if: github.event_name == 'issue_comment'
    permissions:
      contents: write
      pull-requests: write
    uses: JimmayVV/fleet-ci/.github/workflows/review-automerge.yml@v1
